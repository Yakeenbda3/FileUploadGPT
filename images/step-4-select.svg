<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>

  <!-- File picker dialog -->
  <rect x="30" y="20" width="220" height="140" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>

  <!-- Dialog header -->
  <rect x="30" y="20" width="220" height="30" rx="8" fill="#f1f5f9"/>
  <rect x="30" y="42" width="220" height="8" fill="#f1f5f9"/>
  <text x="140" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">Select File to Upload</text>

  <!-- File list -->
  <rect x="45" y="60" width="190" height="28" rx="4" fill="#10a37f" fill-opacity="0.1" stroke="#10a37f" stroke-width="1"/>
  <rect x="55" y="68" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="75" y="78" font-family="Inter, sans-serif" font-size="10" fill="#1e293b">annual-report.pdf</text>
  <text x="195" y="78" font-family="Inter, sans-serif" font-size="9" fill="#64748b">2.4 MB</text>

  <rect x="45" y="92" width="190" height="28" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="55" y="100" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="75" y="110" font-family="Inter, sans-serif" font-size="10" fill="#64748b">document.docx</text>
  <text x="195" y="110" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">850 KB</text>

  <rect x="45" y="124" width="190" height="28" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="55" y="132" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="75" y="142" font-family="Inter, sans-serif" font-size="10" fill="#64748b">data.csv</text>
  <text x="195" y="142" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">1.2 MB</text>

  <!-- Cursor on selected file -->
  <path d="M210 75L215 85L220 82L225 95" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <path d="M210 75L213 84L217 82L210 75Z" fill="#1e293b"/>
</svg>
