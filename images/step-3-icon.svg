<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>

  <!-- Browser toolbar mockup -->
  <rect x="20" y="20" width="240" height="140" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="20" y="20" width="240" height="30" rx="8" fill="#f1f5f9"/>
  <rect x="20" y="42" width="240" height="8" fill="#f1f5f9"/>

  <!-- URL bar -->
  <rect x="60" y="27" width="140" height="16" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#64748b">chat.openai.com</text>

  <!-- Extension icons in toolbar -->
  <rect x="210" y="27" width="16" height="16" rx="3" fill="#e2e8f0"/>
  <rect x="228" y="27" width="16" height="16" rx="3" fill="#e2e8f0"/>

  <!-- FileUploadGPT icon (highlighted) -->
  <rect x="192" y="27" width="16" height="16" rx="3" fill="#10a37f"/>
  <path d="M200 30L196 34H199V38H201V34H204L200 30Z" fill="white"/>

  <!-- Highlight ring -->
  <circle cx="200" cy="35" r="14" stroke="#10a37f" stroke-width="2" fill="none" stroke-dasharray="3 2"/>

  <!-- Arrow pointing to icon -->
  <path d="M200 60L200 75" stroke="#10a37f" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M195 70L200 78L205 70" fill="#10a37f"/>

  <!-- Label -->
  <rect x="155" y="85" width="90" height="24" rx="4" fill="#10a37f" fill-opacity="0.1"/>
  <text x="200" y="101" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#10a37f">Click Extension</text>

  <!-- ChatGPT content area (blurred) -->
  <rect x="30" y="60" width="100" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="30" y="75" width="80" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="30" y="90" width="90" height="8" rx="2" fill="#e2e8f0"/>
