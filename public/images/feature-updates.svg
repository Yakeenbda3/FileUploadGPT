<svg width="500" height="350" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="50" y="50" width="400" height="250" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Circular arrows (refresh/update icon) -->
  <circle cx="250" cy="160" r="60" stroke="#10a37f" stroke-width="4" stroke-dasharray="8 4" fill="none"/>

  <!-- Arrow heads on circle -->
  <path d="M290 100L300 115L285 115Z" fill="#10a37f"/>
  <path d="M210 220L200 205L215 205Z" fill="#10a37f"/>

  <!-- Version badges -->
  <rect x="170" y="130" width="60" height="24" rx="12" fill="#10a37f" fill-opacity="0.15"/>
  <text x="200" y="147" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10a37f">v1.0</text>

  <rect x="230" y="155" width="60" height="24" rx="12" fill="#10a37f" fill-opacity="0.3"/>
  <text x="260" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10a37f">v1.1</text>

  <rect x="270" y="130" width="60" height="24" rx="12" fill="#10a37f"/>
  <text x="300" y="147" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">v1.2</text>

  <!-- Auto-update indicator -->
  <rect x="175" y="240" width="150" height="30" rx="15" fill="#10a37f" fill-opacity="0.1"/>
  <text x="250" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#10a37f">Auto-Updates Enabled</text>

  <!-- Checkmark -->
  <circle cx="190" cy="252" r="8" fill="#10a37f"/>
  <path d="M186 252L189 255L194 249" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
