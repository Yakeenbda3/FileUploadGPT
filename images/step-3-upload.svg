<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180">
  <defs>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="280" height="180" fill="#F9FAFB" rx="12"/>

  <!-- Extension popup -->
  <rect x="60" y="15" width="160" height="150" rx="10" fill="white" filter="drop-shadow(0 4px 20px rgba(79,70,229,0.2))"/>
  <rect x="60" y="15" width="160" height="35" rx="10" fill="url(#s3Grad)"/>

  <!-- Header -->
  <text x="85" y="38" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">FileUploadGPT</text>

  <!-- File upload zone -->
  <rect x="75" y="60" width="130" height="55" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Upload icon -->
  <path d="M130 75 L140 75 L140 70 L150 80 L140 90 L140 85 L130 85 Z" fill="#9CA3AF"/>
  <text x="140" y="105" font-family="Inter, sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Select file</text>

  <!-- Progress bar -->
  <rect x="75" y="125" width="130" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="75" y="125" width="95" height="8" rx="4" fill="url(#s3Grad)"/>

  <!-- Status -->
  <text x="140" y="150" font-family="Inter, sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Uploading... 73%</text>
</svg>
