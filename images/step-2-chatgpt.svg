<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180">
  <rect width="280" height="180" fill="#F9FAFB" rx="12"/>

  <!-- ChatGPT interface mockup -->
  <rect x="20" y="20" width="240" height="140" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="20" y="20" width="240" height="30" rx="8" fill="#F3F4F6"/>

  <!-- URL bar -->
  <rect x="80" y="28" width="120" height="14" rx="3" fill="white"/>
  <text x="90" y="39" font-family="monospace" font-size="8" fill="#6B7280">chat.openai.com</text>

  <!-- ChatGPT logo area -->
  <circle cx="140" cy="90" r="25" fill="#10A37F"/>
  <text x="140" y="95" font-family="Inter, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">GPT</text>

  <!-- New chat text -->
  <text x="140" y="130" font-family="Inter, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Start a new conversation</text>

  <!-- Input area -->
  <rect x="40" y="140" width="200" height="10" rx="3" fill="#F3F4F6"/>
</svg>
