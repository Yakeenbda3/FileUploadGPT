<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>

  <!-- Chat interface -->
  <rect x="20" y="15" width="240" height="150" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>

  <!-- User message (uploaded content) -->
  <rect x="80" y="25" width="170" height="45" rx="8" fill="#10a37f"/>
  <text x="90" y="42" font-family="Inter, sans-serif" font-size="9" fill="white">Here's the document content:</text>
  <text x="90" y="55" font-family="Inter, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)">[Annual Report 2024 - Full text</text>
  <text x="90" y="65" font-family="Inter, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)">uploaded successfully...]</text>

  <!-- ChatGPT response -->
  <rect x="30" y="80" width="170" height="55" rx="8" fill="#f1f5f9"/>
  <circle cx="45" cy="95" r="8" fill="#10a37f"/>
  <text x="45" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="white">G</text>
  <text x="60" y="98" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#1e293b">ChatGPT</text>
  <text x="40" y="115" font-family="Inter, sans-serif" font-size="8" fill="#475569">I've received the full document.</text>
  <text x="40" y="127" font-family="Inter, sans-serif" font-size="8" fill="#475569">What would you like me to help</text>
  <text x="40" y="139" font-family="Inter, sans-serif" font-size="8" fill="#475569">you analyze?</text>

  <!-- Success indicator -->
  <circle cx="230" cy="145" r="12" fill="#22c55e"/>
  <path d="M225 145L228 148L235 141" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
