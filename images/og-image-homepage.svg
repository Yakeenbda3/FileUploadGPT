<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="530" r="300" fill="white" opacity="0.05"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="white"/>
  <path d="M100 110 L120 110 L120 98 L140 120 L120 142 L120 130 L100 130 Z" fill="#4F46E5"/>

  <!-- Main text -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="white">Upload Large Files</text>
  <text x="80" y="360" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="white">to ChatGPT</text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-size="28" fill="white" opacity="0.9">Free Chrome Extension — No File Size Limits</text>

  <!-- CTA -->
  <rect x="80" y="480" width="280" height="60" rx="30" fill="white"/>
  <text x="140" y="520" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#4F46E5">Install Free Extension</text>

  <!-- File icons on right side -->
  <g transform="translate(850, 150)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="white" opacity="0.2"/>
    <text x="60" y="90" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">PDF</text>
  </g>
  <g transform="translate(1000, 200)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="white" opacity="0.15"/>
    <text x="60" y="90" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">DOCX</text>
  </g>
  <g transform="translate(900, 350)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="white" opacity="0.1"/>
    <text x="60" y="90" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">CODE</text>
  </g>

  <!-- Domain -->
  <text x="80" y="590" font-family="Inter, system-ui, sans-serif" font-size="20" fill="white" opacity="0.7">fileuploadgpt.com</text>
</svg>
